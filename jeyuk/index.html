<main>

    </ul>

    </a>
    <p class="note">주문서 작성 후 예약금 입금 시 예약 확정</p>
    <p class="note connection" id="connection-note" role="status" hidden>인터넷 연결 후 주문서를 열 수 있어요.</p>
  </footer>
</main>
<dialog id="install-help" aria-labelledby="install-title">

  <form method="dialog"><button type="submit">확인</button></form>
</dialog>

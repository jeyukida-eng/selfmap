<style>
  :root { --ink: #141010; --cream: #fff4e2; --orange: #ff6a1a; --sub: #6b5d52; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink);

  main { max-width: 480px; margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-left)) 40px; text-align: center; }

  .sub { color: var(--sub); margin: 0 0 22px; font-size: 15px; }
  .cta { display: block; background: var(--orange); color: #fff; text-decoration: none; font-weight: 800; font-size: 20px;

  .card { background: var(--ink); color: #fff; border-radius: 18px; padding: 18px 20px; margin-top: 26px; text-align: left; }

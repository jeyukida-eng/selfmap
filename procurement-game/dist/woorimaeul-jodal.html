<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163e35">
<title>우리 마을 조달청 · 전국 조달 원정대</title>
<style>*{box-sizing:border-box}
:root{--ink:#233e35;--muted:#76816d;--paper:#fafbf4;--line:#d7e0d0;--green:#305c49;--green2:#416f57;--mint:#e9f1e2;--warn:#a17c4d;--warnbg:#f8f0df;--bad:#b4553f;--badbg:#f8e3dc;--gold:#e8aa49}
html,body{height:100%}
body{margin:0;background:#edf1eb;color:var(--ink);font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{cursor:default}
header{height:56px;padding:0 24px;background:#f7f9f3;border-bottom:1px solid #d9e3d5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:#254e40;color:#f5ead0;display:grid;place-items:center;box-shadow:3px 3px 0 #c4d3bb}
.badge{font-size:10px;letter-spacing:1px;color:#fff;background:#d98a4e;border-radius:6px;padding:4px 7px;box-shadow:0 2px 0 #b46a34}
.hbtns{display:flex;gap:6px;align-items:center}
.topbtn{border:1px solid #ccd3c5;background:#fff;border-radius:9px;padding:7px 11px;font-size:12px;color:#365341;white-space:nowrap}
.topbtn:hover{background:#eef3e8}
main{max-width:1800px;margin:auto;padding:14px 24px}
.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.eyebrow{font-size:10px;font-weight:bold;letter-spacing:1.6px;color:#779486}
h1{font-size:25px;letter-spacing:-1.2px;margin:4px 0}
.intro p{margin:0;color:var(--muted);font-size:12px}
.day{font-size:11px;background:#dae5d6;color:#426449;padding:8px 12px;border-radius:9px;font-weight:bold;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:0 0 12px}
.step{padding:8px 12px;background:#e0e7dc;border:1px solid transparent;border-radius:11px;color:#8c9784;font-size:11px;display:flex;align-items:center;gap:8px}
.step small{display:inline-grid;place-items:center;width:20px;height:20px;background:#d2dacb;border-radius:6px;font-size:10px;flex:none}
.step b{font-size:12px}
.step span{font-size:10px}
.step.active{border-color:#7d9f88;background:#f8fbf2;color:#426648;box-shadow:0 4px 0 #c9d7bf}
.step.active small,.step.done small{background:#567e62;color:#fff}
.step.done{color:#5e8062}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.mapwrap{position:relative;height:calc(100dvh - 268px);min-height:430px;max-height:860px;background:#e4ece1;border-radius:24px;border:1px solid #d0decb;overflow:hidden;box-shadow:0 7px 0 #cbd8c5,0 20px 45px #3e5d4910}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.maphead{position:absolute;top:14px;left:14px;z-index:2;background:#ffffffcc;border:1px solid #fff;border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);pointer-events:none}
.maphead small{display:block;font-size:10px;letter-spacing:1px;color:#7b8e7c}
.maphead h2{font-size:19px;margin:3px 0 0;font-weight:900}
.weather{position:absolute;right:14px;top:14px;z-index:2;font-size:11px;background:#ffffffcc;border-radius:9px;border:1px solid #fff;padding:7px 10px;pointer-events:none}
.mapstate{position:absolute;left:14px;bottom:76px;z-index:2;background:var(--warnbg);border:1px solid #ead5b4;border-radius:8px;padding:6px 10px;color:var(--warn);font-size:11px;font-weight:bold;pointer-events:none;max-width:60%}
.mapstate.solved{background:#dfefdc;border-color:#bdd7b6;color:#3f744e}
.mapstate.alert{background:var(--badbg);border-color:#e6b5a6;color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.skip{position:absolute;right:14px;bottom:76px;z-index:3;border:1px solid #c7d5bd;background:#fffdfa;color:#416446;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:bold}
.mapfoot{position:absolute;bottom:14px;left:14px;right:14px;z-index:2;background:#ffffffdb;border:1px solid #fff;border-radius:13px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;box-shadow:0 3px 0 #c1d1b466;min-height:48px}
.mapfoot span{line-height:1.5}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:40%}
.dot{height:8px;width:8px;border-radius:50%;background:#d6dcc8}
.dot.done{background:#477658}
.dot.cur{background:#e8aa49}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{padding:9px 14px;background:#f8faf2;border-radius:12px;border:1px solid #d9e1d1;box-shadow:0 3px 0 #dce4d4}
.stat small{display:block;color:#7d8873;font-size:10px;margin-bottom:3px}
.stat strong{font-size:18px}
.stat em{font-style:normal;font-size:10px;color:#7d8873;margin-left:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:0 4px 0 #d9e1d1;padding:16px;display:flex;flex-direction:column;min-height:300px}
.tag{font-size:10px;letter-spacing:.6px;color:#7a886b;font-weight:bold;display:flex;justify-content:space-between;gap:6px}
.panel h2{font-size:19px;line-height:1.4;letter-spacing:-.6px;margin:7px 0 9px}
.quote{font-size:12px;line-height:1.6;background:#edf1e5;border-radius:12px;padding:10px;margin:0 0 10px;display:flex;gap:9px;align-items:flex-start}
.quote img{width:40px;height:40px;border-radius:50%;flex:none;background:#fff;object-fit:cover}
.quote b{display:block;font-size:10px;color:#7a866f;margin-bottom:2px}
.label{font-size:11px;font-weight:bold;margin:4px 0 7px;display:flex;justify-content:space-between;gap:6px}
.label span{font-weight:normal;color:#8c9480;font-size:10px}
.list{display:grid;gap:7px}
.card{width:100%;text-align:left;background:#fffef9;border:1px solid #dce3d3;border-radius:12px;padding:10px;box-shadow:0 3px 0 #edf0e5;transition:transform .12s,border-color .12s;display:grid;gap:5px;position:relative}
.card:hover:not(:disabled){border-color:#688668;transform:translateY(-1px)}
.card.sel{background:#e9f1e2;border:2px solid #6e9473;padding:9px}
.card:disabled{opacity:.55}
.card .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .t{font-size:12px;font-weight:bold;line-height:1.4}
.card .d{font-size:10px;line-height:1.5;color:#6f7b67}
.pill{font-size:9px;padding:3px 6px;border-radius:6px;background:#eef1e4;color:#5d7259;white-space:nowrap;font-weight:bold}
.pill.a{background:#f4ead5;color:#8c6d31}.pill.b{background:#dfeee4;color:#2f6a4c}.pill.c{background:#e3e6f3;color:#4b5891}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:#dfefdc;color:#3f744e}
.who{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:9px}
.who img{width:44px;height:44px;border-radius:50%;background:#eef1e4;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 0 #dfe6d6}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.metric{background:#f3f5ec;border-radius:7px;padding:4px 5px;font-size:9px;color:#6f7b67;line-height:1.35}
.metric b{display:block;font-size:12px;color:var(--ink)}
.metric.bad{background:var(--badbg)}.metric.bad b{color:var(--bad)}
.metric.good{background:#e1efdc}.metric.good b{color:#2f6a4c}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.chip{font-size:10px;border:1px solid #d9e0cc;padding:4px 7px;border-radius:20px;color:#65795a;background:#fff}
.chip.warn{border-color:#ead5b4;background:var(--warnbg);color:var(--warn)}
.notes{display:grid;gap:5px;margin:9px 0}
.note{font-size:10px;line-height:1.5;background:#fff8e8;border:1px dashed #e5cf9f;border-radius:8px;padding:6px 8px;color:#7b6232}
.hint{font-size:10px;color:#7e8874;line-height:1.6;margin:10px 0}
.primary{background:var(--green);border:0;border-radius:11px;color:#fff;padding:13px 14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;box-shadow:0 4px 0 #1f4234;font-size:13px}
.primary:hover:not(:disabled){background:var(--green2)}
.primary:disabled{opacity:.4}
.ghost{background:none;border:0;color:#6c8064;font-size:11px;padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sec{background:#fff;border:1px solid #c9d6c2;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:bold;color:#365341;box-shadow:0 3px 0 #dde5d6}
.sec:hover{background:#f2f6ed}
.log{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:6px}
.log li{font-size:12px;padding:8px 10px;border-radius:9px;background:#f0f2ea;color:#98a090;display:flex;gap:8px;align-items:center}
.log li.on{background:#e9f1e2;color:#2f5a42;font-weight:bold}
.log li.now{background:#fff3d9;color:#8a6420;font-weight:bold}
.timeline{position:relative;height:46px;margin:8px 0 12px;background:#f3f5ec;border-radius:10px}
.timeline .bar{position:absolute;top:19px;left:12px;right:12px;height:6px;background:#dfe5d6;border-radius:3px}
.timeline .mark{position:absolute;top:6px;transform:translateX(-50%);font-size:9px;font-weight:bold;text-align:center;white-space:nowrap}
.timeline .mark i{display:block;width:12px;height:12px;border-radius:50%;margin:3px auto 0;border:2px solid #fff}
.stars{font-size:30px;letter-spacing:4px;color:#e8aa49;text-align:center;margin:2px 0}
.stars .off{color:#d8dccf}
.total{text-align:center;font-size:13px;color:#6f7b67;margin-bottom:8px}
.total b{font-size:26px;color:var(--ink)}
.bars{display:grid;gap:6px;margin-bottom:8px}
.barrow{display:grid;grid-template-columns:92px 1fr 42px;gap:7px;align-items:center;font-size:10px}
.barrow .track{height:8px;background:#e5e9dd;border-radius:4px;overflow:hidden}
.barrow .fill{height:100%;background:#6e9473;border-radius:4px}
.barrow b{text-align:right;font-size:11px}
.lessons{display:grid;gap:5px;margin:4px 0 10px}
.lesson{font-size:11px;line-height:1.5;padding:7px 9px;border-radius:8px;background:#edf1e5}
.lesson.good{background:#e1efdc;color:#2f5a42}.lesson.bad{background:var(--badbg);color:#87412f}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:9px;color:#85947d;line-height:1.6}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#173b32a8;z-index:20;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);overflow:auto}
.modal{width:min(520px,100%);background:#fbfcf3;border-radius:22px;padding:26px;border:1px solid #dae4d0;box-shadow:0 9px 0 #becdb7;max-height:calc(100dvh - 32px);overflow:auto}
.modal h2{font-size:26px;margin:8px 0;letter-spacing:-1px}
.modal p{font-size:13px;line-height:1.8;color:#66755c}
.modal .primary{margin-top:16px}
.modal.wide{width:min(760px,100%)}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.team div{background:#eef1e4;border-radius:12px;padding:8px 4px;text-align:center;font-size:10px;line-height:1.4;color:#5d6f58}
.team img{width:56px;height:56px;border-radius:50%;background:#fff;display:block;margin:0 auto 4px;object-fit:cover}
.team b{display:block;font-size:11px;color:var(--ink)}
.titlecard h2{font-size:34px;line-height:1.2}
.titlecard .sub{font-size:13px;font-weight:bold;color:#d07a3c;letter-spacing:1px}
/* national map */
.maplayout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.korea{position:relative;height:calc(100dvh - 210px);min-height:470px;max-height:900px;background:linear-gradient(#cfe6ee,#e2eff0);border-radius:24px;border:1px solid #c6d9db;overflow:hidden;box-shadow:0 7px 0 #bfd2d4}
.korea svg{width:100%;height:100%;display:block}
.korea .legend{position:absolute;left:14px;bottom:14px;background:#ffffffd9;border-radius:10px;padding:8px 10px;font-size:10px;display:flex;gap:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible .pin,.mk:hover .pin{stroke:#e8aa49;stroke-width:3}
.mk text{font-family:Arial,'Malgun Gothic',sans-serif;pointer-events:none}
.regionlist{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.rbtn{border:1px solid #dce3d3;background:#fff;border-radius:8px;padding:6px 4px;font-size:11px;font-weight:bold;line-height:1.3}
.rbtn small{display:block;font-size:9px;color:#e0a43c;font-weight:normal;min-height:12px}
.rbtn.done{background:#e1efdc;border-color:#b9d3b0}
.rbtn.sel{border:2px solid #6e9473}
.rbtn.rec{border-color:#e8aa49;box-shadow:0 0 0 2px #f6dfb3}
.finalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:12px 0}
.finalgrid div{background:#eef1e4;border-radius:9px;padding:7px;font-size:11px;font-weight:bold;text-align:center}
.finalgrid small{display:block;color:#e0a43c;font-size:11px}
.message{font-size:17px!important;font-weight:900;color:#2f5a42!important;line-height:1.6!important;text-align:center;background:#e9f1e2;border-radius:14px;padding:14px}
@media(min-width:1550px){.layout,.maplayout{grid-template-columns:minmax(0,1fr) 350px}.panel{padding:19px}}
@media(max-width:1000px) and (min-width:701px){main{padding:12px 14px}.layout,.maplayout{grid-template-columns:minmax(0,1fr) 290px;gap:12px}.step span{display:none}.badge{display:none}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
header{height:50px;padding:0 10px}.brand{font-size:14px;gap:7px}.badge{display:none}.logo{width:26px;height:26px}.topbtn{font-size:10px;padding:6px 7px}
main{padding:10px}h1{font-size:19px}.intro{margin-bottom:8px}.intro p{font-size:10px}.day{font-size:10px;padding:6px 8px}
.steps{gap:4px;margin-bottom:9px}.step{padding:6px 3px;flex-direction:column;gap:3px;text-align:center}.step span{display:none}.step b{font-size:10px}.step small{width:17px;height:17px;font-size:9px}
.layout,.maplayout{grid-template-columns:1fr;gap:12px}
.mapwrap{height:50svh;min-height:330px;max-height:520px;border-radius:18px}
.korea{height:62svh;min-height:400px}
.maphead{top:9px;left:9px;padding:6px 9px}.maphead h2{font-size:15px}.maphead small{font-size:8px}.weather{top:9px;right:9px;font-size:9px;padding:5px 7px}
.mapstate{bottom:62px;left:9px;font-size:9px;padding:5px 7px}.skip{bottom:62px;right:9px;font-size:10px}
.mapfoot{left:9px;right:9px;bottom:9px;padding:8px 10px;font-size:10px;min-height:42px}.dots{display:none}
.stats{gap:6px;margin-top:9px}.stat{padding:7px 9px}.stat strong{font-size:15px}
.panel{padding:13px}.metrics{grid-template-columns:repeat(4,1fr)}
footer{display:block}
.team{grid-template-columns:repeat(2,1fr)}
.titlecard h2{font-size:27px}
}
.tip{font-size:10px;line-height:1.55;background:#eef3fb;border:1px solid #d3deef;border-radius:9px;padding:7px 9px;color:#41557a;margin:8px 0}
.tip b{display:block;font-size:10px;color:#2f5c86;margin-bottom:2px}
.pill.inno{background:#fff1d6;color:#b06d12;border:1px solid #f0cf8f}
.lead{display:grid;gap:8px;margin:14px 0 6px}
.lead div{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #e8aa49;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 #f1d6a4;font-size:12px;color:#5d6f58;line-height:1.5}
.lead img{width:76px;height:76px;border-radius:50%;background:#eef4fb;object-fit:contain}
.lead small{display:inline-block;font-size:10px;font-weight:bold;color:#fff;background:#d98a4e;border-radius:5px;padding:2px 6px;margin-bottom:3px}
.lead b{display:block;font-size:17px;color:var(--ink)}
.team{margin-top:6px}
</style></head><body>
<header><div class="brand"><span class="logo">▦</span> 우리 마을 조달청 <span class="badge">전국 조달 원정대</span></div>
<div class="hbtns"><button class="topbtn" id="btnMap">🗺 전국 지도</button><button class="topbtn" id="btnHelp">도움말</button><button class="topbtn" id="btnSound" aria-pressed="false">🔈 소리 켜기</button></div></header>
<main>
<section id="viewRegion">
  <div class="intro"><div><div class="eyebrow" id="rEyebrow"></div><h1 id="rTitle"></h1><p id="rSub"></p></div><div class="day" id="rDay"></div></div>
  <div class="steps" id="steps" aria-label="임무 단계"></div>
  <div class="layout"><section>
    <div class="mapwrap"><canvas id="scene" aria-label="블록 마을 장면"></canvas>
      <div class="maphead"><small id="townType"></small><h2 id="townName"></h2></div><div class="weather" id="weather"></div>
      <div class="mapstate" id="mapstate"></div><button class="skip hidden" id="btnSkip">⏭ 애니메이션 건너뛰기</button><button class="skip hidden" id="btnCompare">조달 전 보기 ↶</button>
      <div class="mapfoot"><span id="mapmsg"></span><div class="dots" id="dots"></div></div></div>
    <div class="stats"><div class="stat"><small>지역 예산 잔액</small><strong id="sBudget">0</strong><em id="sBudgetTot"></em></div><div class="stat"><small id="sMidLabel">조사한 주민</small><strong id="sMid">0</strong><em id="sMidTot">/ 3</em></div><div class="stat"><small>회복한 지역</small><strong id="sDone">0</strong><em>/ 17</em></div></div>
  </section><aside class="panel" id="panel" aria-live="polite"></aside></div>
</section>
<section id="viewMap" class="hidden">
  <div class="intro"><div><div class="eyebrow">NATIONWIDE PROCUREMENT JOURNEY</div><h1>전국 17개 시·도를 회복시켜요</h1><p>지역을 골라 출발하세요. 추천 순서대로 가도 좋고, 원하는 곳부터 가도 좋아요.</p></div><div class="day" id="mDay"></div></div>
  <div class="maplayout"><div class="korea" id="korea"></div><aside class="panel" id="mapPanel"></aside></div>
</section>
<footer><span>2026 조달청 AI 게임·콘텐츠 공모전 출품작 · 우리 마을 조달청: 전국 조달 원정대 · 오리지널 캐릭터</span><span>공공조달의 원리를 쉽게 체험하도록 단순화한 창작 게임입니다. 지역 상황·제품·수치는 모두 가상입니다.</span></footer>
</main>
<div class="overlay hidden" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<script>

const SCORE_PARTS = [['sat', '주민 만족도', 30], ['bud', '예산 운영', 20], ['fit', '제품 적합성', 25], ['time', '납기·위기 대응', 15], ['care', '유지관리 효율', 10]];

function capOf(reg, pri) { return Math.floor(reg.budget * PRI[pri].cap) }
function expressOf(reg) { return { cost: Math.round(reg.budget * .12), days: 3 } }

// 점수 계산: ch = { heard: 들은 주민 수, pri, prod: 0~2, express }
function scoreRegion(reg, ch) {
  const [, price, perf, maint, days] = reg.products[ch.prod];
  const ex = expressOf(reg), spent = price + (ch.express ? ex.cost : 0);
  const eff = days - (ch.express ? ex.days : 0), meets = perf >= reg.min, late = eff > reg.event.d;
  const survey = [0, 4, 7, 10][Math.min(3, ch.heard)];
  const priPts = ch.pri === reg.focus ? 12 : ch.pri === reg.second ? 7 : 3;
  const sat = survey + priPts + (meets ? 8 : 2) - (late ? 3 : 0);
  const r = spent / reg.budget;
  const bud = r <= .5 ? 20 : r <= .65 ? 17 : r <= .8 ? 13 : 9;
  const fit = meets ? 17 + Math.round(8 * Math.min(1, (perf - reg.min) / 25)) : Math.round(12 * perf / reg.min);
  const time = late ? Math.max(3, 15 - 3 * (eff - reg.event.d)) : 15;
  const minMaint = Math.min(...reg.products.map(p => p[3]));
  const care = Math.min(10, Math.round(10 * minMaint / maint) + (ch.pri === 'upkeep' ? 3 : 0));
  const parts = { sat: Math.max(0, sat), bud, fit, time, care };
  const total = Object.values(parts).reduce((a, b) => a + b, 0);
  return { parts, total, stars: total >= 85 ? 3 : total >= 65 ? 2 : 1, meets, late, spent, eff, price, perf, maint, days };
}

function tone2(freqs, dur = .12, type = 'sine', vol = .07) {
  if (!sound) return;
  try { audioCtx ??= new (window.AudioContext || window.webkitAudioContext)(); const t0 = audioCtx.currentTime; freqs.forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, t0 + i * dur); g.gain.setValueAtTime(vol, t0 + i * dur); g.gain.exponentialRampToValueAtTime(.001, t0 + i * dur + dur * 1.6); o.start(t0 + i * dur); o.stop(t0 + i * dur + dur * 1.7) }) } catch (e) { }
}

  const isl = [[34.62, 126.05, 7], [34.4, 126.25, 5], [34.45, 127.75, 5], [37.5, 126.4, 5]].map(([a, b, r]) => { const [x, y] = proj(a, b); return `<circle cx="${x}" cy="${y}" r="${r}"/>` }).join('');
  const land = `<polygon points="${pts}"/><ellipse cx="${jx}" cy="${jy}" rx="40" ry="19"/>${isl}`;
  const route = ROUTE.map(id => regPos(byId[id]).join(',')).join(' ');
  return `<svg viewBox="0 0 430 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="대한민국 17개 시·도 캠페인 지도">
  <defs><pattern id="studs" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.2" fill="#00000012"/><circle cx="6.3" cy="6.2" r="2.2" fill="#ffffff40"/></pattern>
  <clipPath id="landClip">${land}</clipPath><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <g fill="#a9c7b0" transform="translate(4,8)">${land}</g>
  <g fill="#f4efd9" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">${land}</g>
  <g clip-path="url(#landClip)"><g id="mapGlow" filter="url(#soft)"></g><rect width="430" height="700" fill="url(#studs)"/></g>
  <polyline points="${route}" fill="none" stroke="#8aa596" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <g id="mapRoute"></g><g id="mapMarks"></g>
  <text x="300" y="640" font-size="13" fill="#5f8a9f" font-weight="bold" font-family="Arial,'Malgun Gothic',sans-serif">🌊 바다 건너 제주로</text></svg>`;
}
function renderMap() {
  const K = $('korea'); if (!K.firstChild) K.innerHTML = buildMapSVG() + `<div class="legend"><span><i style="background:#6e9473"></i>회복 완료</span><span><i style="background:#fff;border:1px solid #bbb"></i>도전 전</span><span><i style="background:#e8aa49"></i>추천 다음 지역</span></div>`;
  const rec = nextRecommended(); if (!mapSel) mapSel = rec || 'seoul';
  $('mapGlow').innerHTML = REGIONS.filter(r => save.best[r.id]).map(r => { const [x, y] = regPos(r); return `<circle cx="${x}" cy="${y}" r="46" fill="${r.color}" opacity=".55"/>` }).join('');
  let done = ROUTE.filter(id => save.best[id]);
  $('mapRoute').innerHTML = '';
  $('mapMarks').innerHTML = REGIONS.map(r => {
    const [x, y] = regPos(r), b = save.best[r.id], sel = r.id === mapSel, isRec = r.id === rec;
    return `<g class="mk" data-reg="${r.id}" tabindex="0" role="button" aria-label="${r.full} ${r.mission} ${b ? '완료 별 ' + b.stars + '개' : '미완료'}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      ${isRec ? `<circle r="24" fill="none" stroke="#e8aa49" stroke-width="3"><animate attributeName="r" values="20;27;20" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>` : ''}
      <ellipse cx="2" cy="5" rx="17" ry="13" fill="#2a4a3a22"/>
      <circle class="pin" r="17" fill="${b ? r.color : '#ffffff'}" stroke="${sel ? '#254e40' : b ? '#ffffff' : '#c9d3c4'}" stroke-width="${sel ? 3.5 : 2}"/>
      <text y="5.5" text-anchor="middle" font-size="15">${b ? r.icon : '?'}</text>
      <g transform="translate(0,30)"><rect x="-21" y="-10" width="42" height="15" rx="7" fill="${b ? '#254e40' : '#ffffffdd'}"/><text y="1.5" text-anchor="middle" font-size="10" font-weight="bold" fill="${b ? '#fff' : '#3f5b52'}">${r.name}</text></g>
      ${b ? `<text y="49" text-anchor="middle" font-size="10" fill="#e0a43c" stroke="#fff" stroke-width="2.4" paint-order="stroke">${'★'.repeat(b.stars)}</text>` : ''}</g>`
  }).join('');
  K.querySelectorAll('.mk').forEach(g => { g.onclick = () => { mapSel = g.dataset.reg; sfx.tap(); renderMap() }; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mapSel = g.dataset.reg; renderMap(); $('btnGo') && $('btnGo').focus() } } });
  $('mDay').textContent = `회복 ${doneCount()} / 17 · ★ ${totalStars()} / 51`;
  const r = byId[mapSel], b = save.best[r.id], dc = doneCount();
  $('mapPanel').innerHTML = `<div class="tag"><span>선택한 지역</span><span>${b ? '최고 ' + b.score + '점' : '도전 전'}</span></div>
    <h2>${r.icon} ${esc(r.full)}</h2>
    ${quoteBox('narmi', '나르미 · 조달 원정대장', `${esc(r.town)}에서 「${esc(r.mission)}」 임무가 기다려요. 조달 품목은 ${esc(r.item)}!`)}
    <div class="chips"><span class="chip">예산 ${r.budget}코인</span><span class="chip warn">${r.event.icon} ${esc(r.event.name)}</span>${b ? `<span class="chip" style="color:#e0a43c">${starStr(b.stars)}</span>` : ''}</div>
    <button class="primary" id="btnGo" style="margin:4px 0 12px"><span>${b ? '↻ 최고 점수 재도전' : '🚐 이 지역으로 출발'}</span><span>→</span></button>
    <div class="label">17개 시·도 <span>추천 순서 · ${dc}곳 회복</span></div>
    <div class="regionlist">${ROUTE.map(id => { const x = byId[id], bb = save.best[id]; return `<button class="rbtn ${bb ? 'done' : ''} ${id === mapSel ? 'sel' : ''} ${id === rec ? 'rec' : ''}" data-pick="${id}">${x.name}<small>${bb ? '★'.repeat(bb.stars) : id === rec ? '추천' : ''}</small></button>` }).join('')}</div>
    <div class="btnrow">${dc === 17 ? '<button class="sec" id="btnFinal">🏆 전국 회복 결과</button>' : ''}<button class="ghost" id="btnReset">처음부터 다시 시작</button></div>`;
  $('btnGo').onclick = () => travelTo(r.id);
  $('mapPanel').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { mapSel = b.dataset.pick; sfx.tap(); renderMap() });
  $('btnReset').onclick = confirmReset;
  const bf = $('btnFinal'); if (bf) bf.onclick = showFinal;
}
function confirmReset() {
  openModal(`<div class="eyebrow">RESET</div><h2>처음부터 다시 시작할까요?</h2><p>17개 지역의 기록과 별이 모두 지워져요. 이 작업은 되돌릴 수 없어요.</p><button class="primary" id="mReset"><span>기록 지우고 처음부터</span><span>→</span></button><button class="ghost" id="mCancel">취소</button>`);
  $('mReset').onclick = () => { save = { best: {}, seenFinal: false }; persist(); mapSel = 'seoul'; closeModal(); renderMap() };
  $('mCancel').onclick = closeModal;
}
function showFinal() {
  save.seenFinal = true; persist(); renderMap();
  const sc = Object.values(save.best), avg = Math.round(sc.reduce((a, b) => a + b.score, 0) / Math.max(1, sc.length)), stars = totalStars();
  openModal(`<div class="eyebrow">NATIONWIDE RECOVERY COMPLETE</div><h2>🇰🇷 전국 17개 시·도가 회복되었어요!</h2>
    <p>원정대가 조사하고, 비교하고, 제때 공급한 덕분에 대한민국 곳곳의 일상이 달라졌어요.</p>
    <div class="summary" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="stat"><small>평균 점수</small><strong>${avg}</strong><em>/100</em></div><div class="stat"><small>모은 별</small><strong>${stars}</strong><em>/51</em></div><div class="stat"><small>완벽 회복</small><strong>${sc.filter(x => x.stars === 3).length}</strong><em>/17</em></div></div>
    <div class="finalgrid">${ROUTE.map(id => `<div>${byId[id].icon} ${byId[id].name}<small>${'★'.repeat(save.best[id] ? save.best[id].stars : 0)}</small></div>`).join('')}</div>
    <p class="message">우리의 선택이 지역을 살립니다.<br>필요한 곳에, 필요한 것을.<br>조달로 연결되는 대한민국.</p>
    <button class="primary" id="mClose"><span>완성된 전국 지도 보기</span><span>→</span></button><div class="btnrow"><button class="sec" id="mRestart">처음부터 다시 도전</button></div>`, true);
  $('mClose').onclick = closeModal; $('mRestart').onclick = confirmReset;
}

// ── 타이틀·도움말 ──
function showTitle() {
  view = 'title'; reg = byId.seoul; R = null; show('title'); renderTitleRegion();
  const has = doneCount() > 0;
  openModal(`<div class="titlecard"><div class="sub">우리 마을 조달청 · 확장 캠페인</div><h2>전국 조달 원정대</h2>
    <p>전국 17개 시·도를 여행하며 주민의 이야기를 듣고, 제한된 예산으로 꼭 맞는 제품을 제때 공급해 지역을 회복시켜요.</p>
    <div class="lead">${LEAD.map(([k, n, d]) => `<div><img src="${portrait(k)}" alt=""><span><small>주연</small><b>${n}</b>${d} · 조달청 마스코트</span></div>`).join('')}</div>
    <div class="label">함께하는 원정대 <span>조연</span></div>
    <div class="team">${TEAM.map(([k, n, d]) => `<div><img src="${portrait(k)}" alt=""><b>${n}</b>${d}</div>`).join('')}</div>
    <button class="primary" id="tStart"><span>${has ? `이어하기 (${doneCount()}/17 회복)` : '원정 시작하기'}</span><span>→</span></button>
    <div class="btnrow"><button class="sec" id="tHelp">게임 방법</button>${has ? '<button class="ghost" id="tReset">처음부터 다시 시작</button>' : ''}</div></div>`);
  $('tStart').onclick = () => { closeModal(); mapSel = nextRecommended() || 'seoul'; show('map') };
  $('tHelp').onclick = showHelp;
  const tr = $('tReset'); if (tr) tr.onclick = () => { save = { best: {}, seenFinal: false }; persist(); showTitle() };
}
function renderTitleRegion() {
  $('rEyebrow').textContent = 'BLOCK VILLAGE JOURNEY'; $('rTitle').textContent = '오늘도, 전국을 부탁해요.'; $('rSub').textContent = '필요를 듣고, 꼼꼼히 고르고, 제때 공급하면 일상이 달라집니다.';
  $('rDay').textContent = `원정 ${String(doneCount()).padStart(2, '0')} / 17 회복`; $('townName').textContent = '서울 · 한빛동'; $('townType').textContent = '원정 출발지'; $('weather').textContent = '☀ 맑음';
  $('steps').innerHTML = STEPS.map(([k, n, d], i) => `<div class="step"><small>${i + 1}</small><b>${n}</b><span>${d}</span></div>`).join('');
  $('mapstate').className = 'mapstate solved'; $('mapstate').textContent = '✓ 조달로 달라진 마을'; $('mapmsg').textContent = '좋은 조달은 가장 싼 것이 아니라, 필요한 것을 알맞은 값에 제때 공급하는 것이에요.';
  $('btnSkip').classList.add('hidden'); $('btnCompare').classList.add('hidden');
  $('sBudget').textContent = '-'; $('sBudgetTot').textContent = ''; $('sMid').textContent = '-'; $('sMidTot').textContent = ''; $('sDone').textContent = doneCount();
  $('panel').innerHTML = `<div class="tag"><span>HOW TO PLAY</span></div><h2>지역마다 5단계</h2><ul class="log">${STEPS.map(([k, n, d]) => `<li class="on">${n} · ${d}</li>`).join('')}</ul><p class="hint">점수: 주민 만족도 30 · 예산 운영 20 · 제품 적합성 25 · 납기·위기 대응 15 · 유지관리 효율 10</p>`;
}
function showHelp() {
  openModal(`<div class="eyebrow">HOW TO PLAY</div><h2>좋은 조달의 5단계</h2>
    <p>① <b>현장 조사</b> — 장면 속 주민을 눌러 이야기를 들어요. 숨은 조건(성능 기준·마감일·유지비 걱정)이 나와요.<br>
    ② <b>예산 배분</b> — 안전시설·편의시설·유지관리 중 무엇을 먼저 할지 정해요. 우선순위에 따라 구매 한도와 예비비가 달라져요.<br>
    ③ <b>제품 비교</b> — 나라장터처럼 A형 경제형·B형 균형형·C형 고급형의 가격·성능·연 유지비·납기를 비교해요.<br>
    ④ <b>긴급 상황</b> — 기상·안전 이벤트 전에 도착하는지 확인하고, 필요하면 예비비로 긴급 조달을 요청해요.<br>
    ⑤ <b>지역 회복</b> — 공급 차량 도착 → 하역 → 조립 → 작동 → 주민 생활 변화를 확인해요.</p>
    <p>✦ 표시는 새로운 기술이 담긴 <b>혁신제품</b>이에요. 5년 총비용은 <b>생애주기비용</b>, 즉 사는 값 + 쓰는 동안의 관리비예요.</p>
    <p><b>점수(100점)</b> 주민 만족도 30 · 예산 운영 20 · 제품 적합성 25 · 납기·위기 대응 15 · 유지관리 효율 10 → 85점 이상 ★★★, 65점 이상 ★★</p>
    <p style="font-size:11px">진행 기록은 이 브라우저에 자동 저장돼요. 게임 코인과 제품·지역 상황은 모두 가상입니다.</p>
    <button class="primary" id="hClose"><span>알겠어요</span><span>→</span></button>`);
  $('hClose').onclick = () => { closeModal(); if (view === 'title') showTitle() };
}

// ── 이벤트 연결 ──
$('btnMap').onclick = () => {
  closeModal();
  if (view === 'region' && R && R.phase !== 'result' && R.phase !== 'survey') {
    openModal(`<div class="eyebrow">LEAVE MISSION</div><h2>임무를 중단할까요?</h2><p>${esc(reg.name)} 임무의 이번 진행 내용은 저장되지 않아요. (이전 최고 기록은 유지돼요)</p><button class="primary" id="mLeave"><span>전국 지도로 가기</span><span>→</span></button><button class="ghost" id="mStay">계속하기</button>`);
    $('mLeave').onclick = () => { closeModal(); R = null; show('map') }; $('mStay').onclick = closeModal; return;
  }
  R = null; show('map');
};
$('btnHelp').onclick = showHelp;
$('btnSound').onclick = () => { sound = !sound; $('btnSound').textContent = sound ? '🔊 소리 끄기' : '🔈 소리 켜기'; $('btnSound').setAttribute('aria-pressed', sound); sfx.ok() };
$('btnSkip').onclick = skipInstall;
$('btnCompare').onclick = () => { R.showBefore = !R.showBefore; updateMapState(performance.now()) };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').classList.contains('hidden') && view !== 'title') closeModal() });

// 이미지가 준비되면 초상화가 들어간 화면을 다시 그림
let pending = Object.values(IMG).filter(im => !im.complete).length;
Object.values(IMG).forEach(im => { if (!im.complete) im.onload = () => { if (--pending === 0) refreshUI() } });
function refreshUI() { if (view === 'title') { if (!$('overlay').classList.contains('hidden') && $('tStart')) showTitle(); renderTitleRegion() } else if (view === 'map') renderMap(); else renderRegion() }

frame();
if (DEMO) runDemo(); else showTitle();

// ── 시연영상 자동 재생 모드 (?demo) ─────────────────────────────
// 실제 게임 함수를 그대로 호출해 약 60초 동안 한 지역(제주)을 플레이하고 전국 회복 화면으로 마무리합니다.
// 저장 기록은 건드리지 않습니다(DEMO일 때 persist 비활성).
async function runDemo() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const click = async (sel, ms = 900) => { const el = typeof sel === 'string' ? document.querySelector(sel) : sel; if (el) { el.style.outline = '4px solid #e8aa49'; await wait(450); el.click() } await wait(ms) };
  save = { best: {}, seenFinal: false };
  showTitle(); await wait(3200);                                   // 0~3초: 타이틀
  await click('#tStart', 600);                                      // 3~7초: 전국 지도
  mapSel = 'jeju'; renderMap(); await wait(2200);
  await click('#btnGo', 1600);                                      // 7~17초: 현장 조사
  for (let i = 0; i < 3; i++) await click(`[data-hear="${i}"]`, 2300);
  await click('#go', 1500);                                         // 17~28초: 예산·제품 비교
  await click('[data-pri="safety"]', 1300); await click('#go', 1600);
  await click('[data-prod="1"]', 1700); await click('[data-prod="2"]', 1800);
  await click('#go', 2600);                                         // 28~39초: 긴급 상황 → 공급
  await click('#go', 0);
  await wait(TL.end + 800);                                         // 39~50초: 설치·회복
  await wait(6400);                                                 // 결과·점수 확인
  show('map'); await wait(3200);                                    // 50~60초: 제주가 밝아진 실제 지도 + 핵심 메시지
  openModal(`<div class="eyebrow">NEXT DESTINATION</div><h2>🚐 다음 지역으로 출발!</h2><p>남은 16개 시·도에도 각자 다른 문제가 기다리고 있어요.</p><p class="message">우리의 선택이 지역을 살립니다.<br>필요한 곳에, 필요한 것을.<br>조달로 연결되는 대한민국.</p>`, true);
}

</script></body></html>
